name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Verificações (TypeScript)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  tests:
    name: Testes unitários e de interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:ci

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-testes
          path: coverage/lcov-report
          retention-days: 14

  apk:
    name: Gerar APK (Android)
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - name: Compilar APK de release
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: meupetseguro-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30